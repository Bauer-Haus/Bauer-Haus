<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Back Shortly — BauerHaus</title>
    <meta name="robots" content="noindex">
<style>
    :root {
        --bg: #000000;
        --border: rgba(255, 255, 255, 0.1);
        --text-main: #f5f5f7;
        --text-dim: #86868b;
        --accent: #2997ff;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        background-color: var(--bg);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow-x: hidden;
    }

    .ambient-light {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 900px;
        height: 900px;
        max-width: 150vw;
        max-height: 150vw;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(41, 151, 255, 0.10) 0%, transparent 60%);
        pointer-events: none;
        z-index: 0;
    }

    .panel {
        position: relative;
        z-index: 1;
        text-align: center;
        max-width: 460px;
    }

    .logo {
        font-weight: 600;
        font-size: 14px;
        letter-spacing: -0.01em;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 48px;
    }

    .logo-box {
        width: 20px;
        height: 20px;
        background: var(--text-main);
        color: var(--bg);
        border-radius: 4px;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 800;
    }

    h1 {
        font-size: clamp(38px, 9vw, 56px);
        line-height: 1.05;
        letter-spacing: -0.03em;
        font-weight: 700;
        margin: 0 0 20px;
    }

    p {
        color: var(--text-dim);
        font-size: 17px;
        line-height: 1.6;
        margin: 0 auto 40px;
        max-width: 380px;
    }

    .divider {
        height: 1px;
        background: var(--border);
        margin: 0 auto 28px;
        max-width: 200px;
    }

    a {
        color: var(--accent);
        text-decoration: none;
        font-size: 15px;
        font-weight: 500;
    }

    a:hover { text-decoration: underline; }
</style>
</head>
<body>
    <div class="ambient-light"></div>

    <main class="panel">
        <div class="logo">
            <div class="logo-box">B</div>
            <span>BauerHaus</span>
        </div>

        <h1>Back shortly.</h1>
        <p>We&rsquo;re making some updates. Everything will be back in a little while &mdash; thanks for your patience.</p>

        <div class="divider"></div>
        <a href="mailto:bauer@bauerhaus.io">bauer@bauerhaus.io &rarr;</a>
    </main>
</body>
</html>
